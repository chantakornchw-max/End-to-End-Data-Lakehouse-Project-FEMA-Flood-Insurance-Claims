name: FEMA CI

on:
  push:
    branches: ["main", "feature/v2-incremental-load"]
    paths-ignore:
      - "README.md"
      - "images/**"

  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "images/**"

permissions:
  contents: read

jobs:
  # ==========================================
  # CI: Code Validation
  # ==========================================
  code-validation:
    name: Python & Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # ==========================================
      # Python Linting
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Flake8 Check
        run: |
          python -m pip install flake8
          flake8 scripts/ --max-line-length=200 --ignore=E203,W503,E128,E124,E305,W291,W391,E302,E303,W293,F403,F405,W292,E127,E131,E221,E117

      # ==========================================
      # Terraform Validation
      # ==========================================
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: terraform validate -no-color